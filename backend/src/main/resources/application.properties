spring.application.name=shop
server.port=${PORT:8080}

# MySQL (the database is created automatically if it does not exist)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:school_supplies}?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Admin login for the management panel (HTTP Basic)
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Front-end origins allowed to call the API
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}

# Seed demo categories and products on first start
app.seed=${APP_SEED:true}
